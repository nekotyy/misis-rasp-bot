[project]
name = "misis-rasp-bot"
version = "1.4.0"
description = "Async Telegram/VK bot for MISIS schedule and homework notifications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.20.0,<4.0.0",
    "vkbottle>=4.4.3,<5.0.0",
    "aiosqlite>=0.21.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "APScheduler>=3.10.4,<4.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "aio-pika>=9.5.5,<10.0.0",
    "alembic>=1.13.2,<2.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "pillow>=11.0.0,<13.0.0",
    "pytesseract>=0.3.13,<1.0.0",
]

[project.optional-dependencies]
# Движок OCR с детекцией текста. Нужен для импорта расписания с фотографий:
# Tesseract справляется только со скриншотами, на снимках экрана он бесполезен.
# Тяжёлый (тянет torch), поэтому вынесен в extra: ставится через `uv sync --extra ocr`.
ocr = [
    "easyocr>=1.7.2,<2.0.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # use of assert (ok in tests)
    "S104",   # binding to all interfaces
    "S603",   # subprocess call
    "S607",   # starting a process with partial path
    "B008",   # function call in default argument (FastAPI Depends)
    "S608",   # parameterized query placeholder construction
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "S311"]
