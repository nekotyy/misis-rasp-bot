services:
  bot:
    build: .
    container_name: misis-rasp-bot
    restart: unless-stopped
    depends_on:
      doh:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TZ: ${APP_TIMEZONE:-Europe/Moscow}
      DATABASE_PATH: /app/runtime/bot.db
      ATTACHMENTS_PATH: /app/runtime/attachments
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-misis_notifications}
      RABBITMQ_PREFETCH_COUNT: ${RABBITMQ_PREFETCH_COUNT:-20}
      LESSON_COUNTERS_PATH: /app/runtime/lesson_counters.json
      LESSON_COUNTERS_QUEUE: ${LESSON_COUNTERS_QUEUE:-misis_lesson_counters}
      GEMINI_COOKIE_PATH: /app/runtime/gemini_cookies
      GEMINI_ENV_PATH: /app/config/.env
    dns:
      - 172.29.0.53
    extra_hosts:
      - "rabbitmq:172.29.0.10"
    volumes:
      - ./runtime:/app/runtime
      - ./.env:/app/config/.env

  doh:
    image: cloudflare/cloudflared:2026.1.2
    container_name: misis-gemini-doh
    restart: unless-stopped
    command:
      - proxy-dns
      - --address
      - 0.0.0.0
      - --port
      - "53"
      - --upstream
      - https://xbox-dns.ru/dns-query
    networks:
      default:
        ipv4_address: 172.29.0.53

  web:
    build: .
    container_name: misis-web-configurator
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      TZ: ${APP_TIMEZONE:-Europe/Moscow}
      DATABASE_PATH: /app/runtime/bot.db
      LESSON_COUNTERS_PATH: /app/runtime/lesson_counters.json
      WEB_USERS_JSON_IMPORT_PATH: /app/runtime/web_users.json
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
    command: ["uv", "run", "--frozen", "uvicorn", "web_configurator.app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    volumes:
      - ./runtime:/app/runtime

  nginx:
    image: nginx:1.27-alpine
    container_name: misis-dashboard-nginx
    restart: unless-stopped
    profiles:
      - nginx
    depends_on:
      - web
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-dashboard.example.com}
      NGINX_HTTP_PORT: ${NGINX_HTTP_PORT:-80}
      NGINX_HTTPS_PORT: ${NGINX_HTTPS_PORT:-2443}
      WEB_UPSTREAM: ${WEB_UPSTREAM:-web:8080}
      NGINX_SSL_CERT_PATH: ${NGINX_SSL_CERT_PATH:-/etc/letsencrypt/live/dashboard.example.com/fullchain.pem}
      NGINX_SSL_KEY_PATH: ${NGINX_SSL_KEY_PATH:-/etc/letsencrypt/live/dashboard.example.com/privkey.pem}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-2443}:2443"
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/certs:/etc/letsencrypt:ro

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: misis-rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "${RABBITMQ_BIND_IP:-127.0.0.1}:5672:5672"
      - "${RABBITMQ_BIND_IP:-127.0.0.1}:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      default:
        ipv4_address: 172.29.0.10

volumes:
  rabbitmq-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/24
