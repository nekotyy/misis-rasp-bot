[package]
name = "misis-rasp-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
regex = "1"
dotenvy = "0.15"
unicode-casefold = "0.2"
unicode-normalization = "0.1"
difflib = "0.4"
pbkdf2 = "0.12"
base64 = "0.22"
subtle = "2"
getrandom = "0.2"
tempfile = "3"
sha2 = "0.10"
scraper = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "signal"] }
chrono = "0.4"
chrono-tz = "0.10"
rusqlite = { version = "0.38", features = ["bundled"] }
serde_json = "1"
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
hmac = "0.12"
url = "2"
cron-parser = "0.12.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
