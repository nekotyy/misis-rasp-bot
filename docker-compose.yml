services:
  bot:
    build: .
    container_name: misis-rasp-bot
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TZ: ${APP_TIMEZONE:-Europe/Moscow}
      DATABASE_PATH: /app/runtime/bot.db
      ATTACHMENTS_PATH: /app/runtime/attachments
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-misis_notifications}
      RABBITMQ_PREFETCH_COUNT: ${RABBITMQ_PREFETCH_COUNT:-20}
      LESSON_COUNTERS_PATH: /app/runtime/lesson_counters.json
      LESSON_COUNTERS_QUEUE: ${LESSON_COUNTERS_QUEUE:-misis_lesson_counters}
    volumes:
      - ./runtime:/app/runtime

  web:
    build: .
    container_name: misis-web-configurator
    restart: unless-stopped
    profiles:
      - web
    env_file:
      - .env
    environment:
      TZ: ${APP_TIMEZONE:-Europe/Moscow}
      DATABASE_PATH: /app/runtime/bot.db
      LESSON_COUNTERS_PATH: /app/runtime/lesson_counters.json
      WEB_USERS_PATH: /app/runtime/web_users.json
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
    command: ["uv", "run", "--frozen", "uvicorn", "web_configurator.app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    volumes:
      - ./runtime:/app/runtime

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: misis-rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  rabbitmq-data:
