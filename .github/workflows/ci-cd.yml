name: CI/CD

on:
  pull_request:
    branches:
      - main
      - development
  push:
    branches:
      - main
      - development

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-install-project

      - name: Validate Python syntax
        run: uv run --frozen python -m compileall -q src web_configurator tests

      - name: Validate installed dependencies
        run: uv pip check

      - name: Run unit tests
        run: uv run --frozen python -m unittest discover -s tests -p "test_*.py" -v

      - name: Prepare CI env file
        run: cp .env.example .env

      - name: Docker compose smoke check
        run: docker compose config

