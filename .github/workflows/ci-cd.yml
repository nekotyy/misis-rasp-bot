name: CI/CD

on:
  pull_request:
    branches:
      - main
      - development
      - rust-main
  push:
    branches:
      - main
      - development
      - rust-main

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-install-project

      - name: Lint with ruff
        run: uv run --frozen ruff check src web_configurator tests scripts --output-format=github

      - name: Validate Python syntax
        run: uv run --frozen python -m compileall -q src web_configurator tests scripts

      - name: Validate installed dependencies
        run: uv pip check

      - name: Run unit tests
        env:
          OUTBOX_TEST_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/
        run: uv run --frozen python -m unittest discover -s tests -p "test_*.py" -v

      - name: Prepare CI env file
        run: cp .env.example .env

      - name: Docker compose smoke check
        run: docker compose config

  rust-ci:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check

      - name: Lint with clippy
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --manifest-path rust/Cargo.toml

